# Sample workflow for building and deploying a Hugo site to GitHub Pages
# 
# To change theme:
# 1. Update THEME_NAME environment variable below
# 2. Update hugo.toml theme configuration
# 3. Update .gitmodules submodule reference
# 4. Commit and push changes
#
name: Deploy Blog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
      THEME_NAME: PaperMod
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      - name: Install Dart Sass
        run: |
          # Download Dart Sass directly from GitHub releases instead of using snap
          DART_SASS_VERSION="1.77.4"
          mkdir -p ${{ runner.temp }}/dart-sass
          cd ${{ runner.temp }}/dart-sass
          wget -q https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
          tar -xzf dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
          echo "${{ runner.temp }}/dart-sass/dart-sass:$PATH" >> $GITHUB_PATH
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update Analytics Data
        uses: ./.github/actions/update-analytics
        with:
          google-service-account-key: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          google-analytics-property-id: ${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }}
          commit-message: "📊 Quick analytics update before build"
      - name: Update submodules
        run: |
          echo "Initial submodule status:"
          git submodule status || echo "No submodules found"
          
          echo "Syncing and updating submodules..."
          git submodule sync --recursive
          git submodule update --init --recursive --force
          
          echo "Final submodule status:"
          git submodule status
          
          echo "Checking themes directory structure:"
          ls -la themes/ || echo "Themes directory not found"
          ls -la themes/${THEME_NAME}/ || echo "${THEME_NAME} directory not found"
          
          # Verify specific critical files
          echo "Checking for critical theme files:"
          [ -f "themes/${THEME_NAME}/theme.toml" ] && echo "✅ ${THEME_NAME} theme.toml found" || echo "❌ ${THEME_NAME} theme.toml missing"
          [ -f "themes/${THEME_NAME}/layouts/_default/baseof.html" ] && echo "✅ baseof.html found" || echo "❌ baseof.html missing"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Verify theme installation
        run: |
          echo "=== THEME VERIFICATION ==="
          echo "Verifying ${THEME_NAME} theme is properly installed..."
          
          if [ ! -f "themes/${THEME_NAME}/theme.toml" ]; then
            echo "❌ ERROR: ${THEME_NAME} theme.toml not found!"
            echo "Available files in themes/:"
            ls -la themes/ || echo "Themes directory completely missing"
            echo "Available files in themes/${THEME_NAME}/:"
            ls -la themes/${THEME_NAME}/ || echo "${THEME_NAME} directory completely missing"
            exit 1
          fi
          echo "✅ ${THEME_NAME} theme.toml found"
          
          if [ ! -f "themes/${THEME_NAME}/layouts/_default/baseof.html" ]; then
            echo "❌ ERROR: Required theme baseof.html not found!"
            echo "Available files in layouts directory:"
            ls -la themes/${THEME_NAME}/layouts/ || echo "Layouts directory missing"
            exit 1
          fi
          echo "✅ Required theme layouts found"
          
          # Test if Hugo can see the theme
          echo "Testing Hugo theme detection..."
          hugo list all --quiet > /dev/null 2>&1 || {
            echo "❌ ERROR: Hugo cannot properly detect the theme"
            hugo version
            echo "Hugo configuration:"
            cat hugo.toml
            exit 1
          }
          echo "✅ Hugo can detect the theme properly"
          echo "=== THEME VERIFICATION COMPLETE ==="
      - name: Pre-build verification
        run: |
          echo "=== FINAL PRE-BUILD CHECK ==="
          echo "Working directory: $(pwd)"
          echo "Hugo version: $(hugo version)"
          echo "Theme configuration in hugo.toml:"
          grep -A 5 -B 5 "theme" hugo.toml || echo "No theme config found"
          echo "Final check - critical files exist:"
          [ -f "themes/${THEME_NAME}/layouts/_default/baseof.html" ] && echo "✅ baseof.html still present" || echo "❌ baseof.html disappeared!"
          [ -f "themes/${THEME_NAME}/theme.toml" ] && echo "✅ theme.toml present" || echo "❌ theme.toml missing!"
          echo "Content directory structure:"
          ls -la content/ || echo "No content directory"
          python3 scripts/check-posts.py
          pip install -q -r requirements.txt
          pytest tests/ -q
          echo "=== STARTING HUGO BUILD ==="
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.pages.outputs.base_url }}/"          
      - name: Post-build checks
        run: |
          echo "=== POST-BUILD CHECKS ==="
          [ -f "public/CNAME" ] && echo "✅ CNAME present" || (echo "❌ CNAME missing from public/" && exit 1)
          if command -v xmllint &>/dev/null; then
            xmllint --noout public/index.xml && echo "✅ RSS valid" || (echo "❌ RSS invalid" && exit 1)
          fi
          grep -rl "@waline/client" public/posts/*/index.html | head -1 | grep -q . \
            && echo "✅ Waline embed present in posts" \
            || (echo "❌ Waline embed not found — check comments = true in hugo.toml" && exit 1)
          grep -rl "comments.cloudarchitectec.com" public/posts/*/index.html | head -1 | grep -q . \
            && echo "✅ Comment server URL present in posts" \
            || (echo "❌ Comment server URL not found" && exit 1)
          grep -rl "zh-TW" public/posts/*/index.html | head -1 | grep -q . \
            && echo "✅ Waline zh-TW locale present in posts" \
            || (echo "❌ Waline zh-TW locale not found" && exit 1)
          if grep -rE 'src=\\?"?images/' public/posts/*/index.html; then
            echo "❌ Unresolved image src in built HTML (PaperMod could not resolve bundle resource)"
            exit 1
          fi
          echo "✅ All post images resolved in built HTML"
          echo "=== CHECKS DONE ==="
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
