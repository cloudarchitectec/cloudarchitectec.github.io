name: Update Analytics Data

on:
  # Trigger 1: Weekly schedule (configurable)
  schedule:
    # Run every Sunday at 2 AM UTC (change cron below to modify frequency)
    # Examples: '0 2 * * 0' (weekly), '0 2 * * *' (daily), '0 2 1 * *' (monthly)
    - cron: '0 2 * * 0'
  
  # Trigger 2: Manual run
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if data is recent'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # Needed to commit analytics data

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Check if analytics update is needed
        id: check_update
        run: |
          echo "Checking if analytics update is needed..."
          
          # Check if data file exists and is recent (less than 6 hours old)
          if [[ -f "data/analytics.json" && "${{ github.event.inputs.force_update }}" != "true" ]]; then
            last_updated=$(jq -r '.lastUpdated // empty' data/analytics.json 2>/dev/null || echo "")
            if [[ -n "$last_updated" ]]; then
              last_epoch=$(date -d "$last_updated" +%s 2>/dev/null || echo "0")
              current_epoch=$(date +%s)
              age_hours=$(( (current_epoch - last_epoch) / 3600 ))
              
              echo "Last updated: $last_updated"
              echo "Age: $age_hours hours"
              
              if [[ $age_hours -lt 6 ]]; then
                echo "Data is recent (less than 6 hours old), skipping update"
                echo "skip_update=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi
          
          echo "Analytics update needed"
          echo "skip_update=false" >> $GITHUB_OUTPUT
          
      - name: Install dependencies
        if: steps.check_update.outputs.skip_update != 'true'
        run: |
          pip3 install -r .github/workflows/scripts/requirements.txt
          
      - name: Update Analytics Data
        if: steps.check_update.outputs.skip_update != 'true'
        uses: ./.github/actions/update-analytics
        with:
          google-service-account-key: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          google-analytics-property-id: ${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }}
          commit-message: "📊 Update analytics ($(date '+%Y-%m-%d %H:%M UTC'))"
          git-user-email: "cloudarchitectec@gmail.com"
          git-user-name: "Analytics Bot"
          
      - name: Push changes
        if: steps.check_update.outputs.skip_update != 'true'
        run: |
          # Push if there are committed changes
          if [[ $(git log --oneline -1 --grep="📊 Update analytics") ]]; then
            git push
            echo "✅ Analytics data pushed to repository"
          else
            echo "📊 No analytics changes to push"
          fi
          
      - name: Output summary
        run: |
          echo "🎯 Analytics Update Summary"
          echo "========================="
          if [[ "${{ steps.check_update.outputs.skip_update }}" == "true" ]]; then
            echo "⏭️  Update skipped - data is recent"
          else
            echo "✅ Update completed"
            if [[ -f "data/analytics.json" ]]; then
              echo "📊 Latest metrics:"
              jq -r '"   📈 Page Views: " + .formatted.totalPageViews' data/analytics.json
              jq -r '"   👥 Users: " + .formatted.totalUsers' data/analytics.json
              
              # Show top countries with percentages
              echo "   🌍 Top Countries:"
              jq -r '.topCountries[] | select(.percentage > 0) | "      " + .country + ": " + (.percentage | tostring) + "% (" + (.users | tostring) + " users)"' data/analytics.json | head -5
              
              jq -r '"   🕐 Last Updated: " + .lastUpdated' data/analytics.json
            fi
          fi