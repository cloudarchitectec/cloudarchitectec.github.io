name: Validate Posts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.150.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: |
          DART_SASS_VERSION="1.77.4"
          mkdir -p "${{ runner.temp }}/dart-sass"
          cd "${{ runner.temp }}/dart-sass"
          wget -q "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${{ runner.temp }}/dart-sass/dart-sass:$PATH" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Prepare Python venv
        run: ENSURE_VENV_PLAYWRIGHT=1 bash scripts/ensure-venv.sh

      - name: Validate Hugo posts
        run: .venv/bin/python3 scripts/check-posts.py

      - name: Enforce forward-looking content style rules
        run: .venv/bin/python3 scripts/check-spelling.py --strict --posts-only

      - name: docs/POSTS-INDEX.md is current
        run: .venv/bin/python3 scripts/gen-posts-index.py --check

      - name: Cache Hugo processed images
        # resources/_gen holds resized/WebP image variants; without this cache every
        # PR build reprocesses all post images from scratch
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-images-${{ hashFiles('content/posts/**/images/**') }}
          restore-keys: |
            hugo-images-
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          set -euo pipefail
          output="$(hugo --gc --minify --cleanDestinationDir --printPathWarnings --logLevel warn 2>&1)"
          echo "$output"
          if echo "$output" | grep -qiE 'duplicate path|(^|[[:space:]])WARN:'; then
            echo "Hugo build warnings detected"
            exit 1
          fi

      - name: Post-build checks
        run: ./scripts/verify-build.sh

      - name: Run tests
        env:
          HUGO_SKIP_REBUILD: "1"
        run: .venv/bin/pytest tests/ -q
