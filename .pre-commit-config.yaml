repos:
  - repo: local
    hooks:
      - id: check-posts
        name: Hugo post rules
        entry: python3 scripts/check-posts.py --staged
        language: system
        files: ^content/posts/
        pass_filenames: false
      - id: list-template-lint
        name: list template structure
        entry: bash -c 'if [ -x .venv/bin/pytest ]; then .venv/bin/pytest tests/test_list_pages.py::TestListTemplateStructure -q; else pytest tests/test_list_pages.py::TestListTemplateStructure -q; fi'
        language: system
        files: ^layouts/_default/list\.html$
        pass_filenames: false
