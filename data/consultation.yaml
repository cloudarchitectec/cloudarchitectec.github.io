faq:
  heading: "常見問題"
  items:
    - question: "我適合預約嗎？"
      open: true
      answer:
        - "如果你正面臨職涯上的重要決策，例如轉職、澳洲求職、Offer 取捨、職涯方向、技術路線選擇，希望有人陪你分析各種選項與利弊，那這場諮詢會很適合你。"
        - "如果你的需求主要是英文履歷修改、Mock Interview 或 Cover Letter，我建議尋找更專門的服務。"
    - question: "我需要先準備什麼？"
      answer:
        - "預約後，只需要填寫簡單的背景資訊與希望討論的主題即可。我會在諮詢前閱讀你的資料，讓對談可以直接進入重點。"
    - question: "一次可以問很多問題嗎？"
      answer:
        - "建議聚焦在一個核心議題，通常會有最好的效果。如果時間允許，也可以延伸討論相關問題，但我們會以核心議題為優先。"
    - question: "如果我還不知道自己要問什麼，可以預約嗎？"
      answer:
        - "可以。如果你只是覺得「卡住了」，但說不上來是哪裡，我也會協助你一起釐清問題，再一起討論下一步。"
    - question: "諮詢後還可以再問問題嗎？"
      answer:
        - "當然可以！如果有少量延伸問題，可以透過 Email 簡單詢問或回報近況；如果有新的議題，建議你再預約一次諮詢進行深入探討。"
    - question: "我人不在澳洲，也適合嗎？"
      answer:
        - "可以。許多預約者目前都在台灣，想了解澳洲科技業、市場現況、移民與求職方向。Google Meet 線上進行，不受地區限制。"

about:
  heading: "為什麼找 EC 諮詢？"
  bio: "嗨，我是 EC。從文組轉戰科技業，先後在澳洲 Amazon（AWS）與 Microsoft 擔任雲端架構師，現為資深 DevOps 工程師。在澳洲生活超過十年，經歷過打工度假、留學與自行申請移民。
  這些年來，我不僅在部落格上寫出轉職心得與職場觀察，也成功協助過許多學員在澳洲科技業轉職、釐清職涯方向。"
  links:
    - label: "認識 EC"
      url: "/portfolio/career-zh/"
    - label: "文組轉職進 Amazon"
      url: "/posts/2022-12-03-bootcamp-to-aws/"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/elliettchen/"

cta:
  heading: "還在觀望？"
  text: "有些問題即使是 Google 或是問 AI 都很難找到答案。如果你正卡在某個轉職十字路口、如果你想聽聽業界真實的聲音與實戰建議，也許我們可以一起聊聊，找出下一步的方向。"
  label: "預約澳洲職涯策略諮詢（A$119）"
