testimonials:
  # Featured — 6 則（依說服力排序）
  - name: "Alison"
    quote: "EC 能夠提供貼近澳洲職場的觀點，而且有認真在了解諮詢對象的背景跟問題、耐心傾聽並提供相對的建議，不是給千篇一律罐頭解答。整個諮詢過程覺得被尊重也獲得蠻多不同的 insight。"
    tags: ["履歷", "面試", "澳洲職場"]
    featured: true

  - name: "Ken"
    quote: "EC 不僅分享海外求職、轉職工程師，到進入 AWS / Microsoft / Shell 的經驗，更重要的是，能協助我釐清當前困惑。在諮詢過程中，EC 能快速抓住核心價值與職涯定位，並對旅外工程師如何建立競爭力，有非常實務且可行的策略。"
    tags: ["海外求職", "轉職", "職涯定位"]
    featured: true

  - name: "Michael"
    quote: "EC 對我的背景資料深入地了解後，給出很有建設性的建議，也針對我的履歷不足的地方調整的很到位，真的獲益良多，新的履歷上線一周就獲得面試邀請。我覺得所以在職涯上有需要協助的都快來預約！！"
    tags: ["履歷", "求職策略"]
    featured: true

  - name: "amber"
    quote: "謝謝 EC，職涯發展和簽證策略都很不錯，利弊分析後能果斷放棄讀書這條選項，花錢還是得花在成功機率比較大的刀口上，也提供資源。EC 思考有條理，很推薦心中有幾百個困惑的讀者們去約時間聊一聊。"
    tags: ["簽證策略", "職涯規劃"]
    featured: true

  - name: "Gina"
    quote: "EC 的諮詢非常專業且有條理，不僅針對我的履歷、求職策略和 LinkedIn 提供了許多實用的建議與小技巧，還分享了如何優化 GitHub，全面性的提升個人曝光度。這次的諮詢不僅提供了技術層面的建議，也讓我在職涯選擇上更有信心。"
    tags: ["履歷", "LinkedIn", "求職策略"]
    featured: true

  - name: "Will"
    quote: "有處理過簽證的背景、懂簽證之外也有實際在科技業工作過、還有在澳洲生活過 11 年。這樣的背景其實會讓人很願意聽你分享。"
    tags: ["簽證", "科技業", "澳洲生活"]
    featured: true

  # More — 其餘精選回饋
  - name: "Jill"
    quote: "EC 認真親切又專業！諮詢前有詳讀諮詢對象提供的背景資料，讓人感受到充分準備，因此在交流討論的過程中非常有效率。能針對個人需求提供建議，而非給出 Google 上容易查到的千篇一律的回答。"
    tags: ["澳洲生活", "求職建議"]
    featured: false

  - name: "Eva"
    quote: "EC 的建議很有方向感，也很實際，讓我知道自己的履歷該強調什麼、該調整什麼，可以更快理出頭緒！"
    tags: ["履歷", "求職技巧"]
    featured: false

  - name: "Ray"
    quote: "EC 的履歷精修諮詢內容氛圍輕鬆，但每一句對話往來都是切合問題的分享或討論，一小時很快就過了，推薦！"
    tags: ["履歷", "面試"]
    featured: false

  - name: "John"
    quote: "EC 會事先做功課，完整看過你的履歷背景，並在諮詢一開始先與你確認諮詢大綱與方向，確保雙方認知一致。過程中鉅細靡遺地回答問題，最後依照個人背景提供具體可行的方向與行動步驟，非常推薦。"
    tags: ["雲端職涯", "LinkedIn", "職涯規劃"]
    featured: false

  - name: "Eason"
    quote: "我相信不少人也有需要工程師轉職的需求，以及海外移民等等，EC 剛好都有這方面的經驗，而我們大部分周圍圈子內，同時做到科技業轉職跟移民的朋友偏少，如果朋友也對這類話題有興趣我會推薦！"
    tags: ["轉職", "移民"]
    featured: false

  - name: "Jimmy"
    quote: "EC 在澳洲待了十幾年，擁有豐富的澳洲經驗，除了工作以外，澳洲大大小小的事她也很熟悉，對於想了解澳洲或是已經下定決心去澳洲發展的人相當推薦！"
    tags: ["澳洲生活", "海外求職"]
    featured: false

  - name: "Mei"
    quote: "EC 的諮詢切中要點，直接指出需要改進的關鍵問題。建議實用且具體，還分享了許多實用的寫作小技巧。鼓勵並非空泛的心靈雞湯，而是幫助我深入認清自身的優劣勢。"
    tags: ["履歷", "求職策略"]
    featured: false

  - name: "Alan"
    quote: "非常滿意！EC 解答了非常多我的疑問，從澳洲生活、職場、地區職缺，即便時間已超過一個小時，仍耐心協助我檢視履歷，並指出可以優化的地方，讓我獲益良多。"
    tags: ["履歷", "澳洲求職"]
    featured: false

  - name: "Alex"
    quote: "網上有很多資訊可以查得到，但如果想知道在科技業工作的細節和一些做不同轉職的心路歷程可以跟 EC 聊一聊，會比看一些文字分享更有說話力。"
    tags: ["科技業", "轉職"]
    featured: false

  - name: "Su"
    quote: "很感謝 EC 在諮詢對談的過程當中，針對我的個人經歷協助歸納出我的優勢與可以優化進步的面相，並提供給我幾個若要進入雲端產業可以嘗試的選項，讓我對於未來如何著手執行有更明確的目標。"
    tags: ["雲端職涯", "轉職"]
    featured: false

  - name: "Otter"
    quote: "對澳洲的就業市場迷茫，沒有過去的經驗也可以找到工作，對想要轉職的人來說簡直是一個很大的鼓勵，跟 EC 聊完後，更有動力去做現在能力範圍能及的事。"
    tags: ["轉職", "澳洲求職"]
    featured: false

  - name: "Peter"
    quote: "對談流暢、條理清晰，針對個人優缺點提供建議；全英文對談也能從中學習。前輩的經驗與視野非常有參考性。"
    tags: ["英文對談", "職涯建議", "澳洲生活"]
    featured: false

  - name: "Yao Wen"
    quote: "諮詢過程像跟朋友聊天一樣很放鬆，EC 分享轉職經驗中的問題、策略與行動都很清晰，也根據個人狀況給予合適的建議與方向，非常有幫助。真實的經驗分享讓我覺得值得推薦。"
    tags: ["LinkedIn", "履歷", "求職策略"]
    featured: false

  - name: "匿名"
    quote: "簡單清楚地點出之前求職的盲點，接著給與具體的大方向和建議。諮詢過後消除了焦慮。"
    tags: ["轉職", "求職策略"]
    featured: false

  - name: "Yu-hsien"
    quote: "收穫非常多，沒有想到連履歷你都看得這麼仔細！每次也都有發現一些盲點，並得到明確的改善方法。"
    tags: ["履歷", "面試"]
    featured: false
