baseURL = "https://cloudarchitectec.github.io/"
languageCode = "zh-Hant"
defaultContentLanguage = "zh-Hant"
title = "Cloud Architect EC"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

# Pagination settings (Hugo v0.128.0+ format)
[pagination]
  pagerSize = 8  # Number of posts per page
  path = "page"   # URL structure: /page/2/

# URL configuration for Chinese characters
removePathAccents = false
disablePathToLower = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production" # to enable google analytics, opengraph, twitter-cards and schema.
  title = "Cloud Architect EC"
  description = "澳洲雲端架構師 EC 的技術部落格 - Cloud Architect EC's Tech Blog"
  keywords = ["Cloud Architecture", "AWS", "Azure", "Tech Blog", "雲端架構"]
  author = "Cloud Architect EC"
  
  # Google Analytics Configuration
  googleAnalytics = "G-F5Z4F1PYEE"  
  
  defaultTheme = "auto" # dark, light
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  ShowPageNums = true  # Enable page numbers in pagination

  # Fuzzy search configuration optimized for Traditional Chinese
  [params.fuseOpts]
    isCaseSensitive = false
    includeScore = false
    includeMatches = false
    minMatchCharLength = 1  # Chinese characters are meaningful individually
    shouldSort = true
    findAllMatches = true   # Find all matches for better Chinese search
    keys = ["title", "permalink", "summary", "content"]
    location = 0
    threshold = 0.2  # More strict for Chinese to avoid too many false matches
    distance = 50    # Reduce distance for more precise matching
    ignoreLocation = true

  [params.assets]
    # Using existing logo as favicon
    favicon = "ec-logo.png"
    # favicon16x16 = "favicon-16x16.png"  # Uncomment when you have PNG files
    # favicon32x32 = "favicon-32x32.png"  # Uncomment when you have PNG files  
    apple_touch_icon = "ec-logo.png"
    # safari_pinned_tab = "safari-pinned-tab.svg"  # Uncomment when you have SVG files

  [params.label]
    text = "Cloud Architect EC"
    icon = "ec-logo.png"
    iconHeight = 35

  # profile-mode
  [params.profileMode]
    enabled = false
  
  [[params.socialIcons]]
    name = "email"
    url = "cloudarchitectec@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/elliettchen/"

  [[params.socialIcons]]
    name = "threads"
    url = "https://www.threads.com/@cloud_architect_ec"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/cloudarchitectec"

  # Enable comments globally
  comments = true
  
  # Giscus Comments Configuration
  [params.giscus]
    repo = "cloudarchitectec/cloudarchitectec.github.io"
    repoId = "R_kgDOPv4HjQ"
    category = "General"
    categoryId = "DIC_kwDOPv4Hjc4Cv-up"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-TW"

[languages]
  [languages.zh-hant]
    languageName = "繁體中文"
    title = "澳洲雲端架構師 EC"
    weight = 1
    contentDir = "content"
    [languages.zh-hant.params.homeInfoParams]
      Title = "澳洲雲端架構師 EC 的部落格"
      Content = "旅澳多年的台灣女生，從打工度假到移民澳洲，從文組到轉職成工程師 (成功入職 Amazon & 微軟)。旅行過 22個國家，致力於生活中的各式體驗。希望跟大家分享我對澳洲生活、職場、文化、旅行的觀察筆記。點此預約[<<澳洲雲端架構師 EC 職涯諮詢服務>>](https://forms.gle/Zuro8YryCN5hH9Gk9)"

    [[languages.zh-hant.menu.main]]
      name = "精選文章"
      url = "/posts/2018-01-02-ec-post-list"
      weight = 20
    [[languages.zh-hant.menu.main]]
      name = "職涯諮詢"
      url = "/posts/2018-01-03-ec-consultation"
      weight = 30
    [[languages.zh-hant.menu.main]]
      name = "我是EC"
      url = "/posts/2018-01-01-iam-ec"
      weight = 10
    [[languages.zh-hant.menu.main]]
      name = "標籤"
      url = "/tags"
      weight = 40
    [[languages.zh-hant.menu.main]]
      name = "分類"
      url = "/categories"
      weight = 50
    [[languages.zh-hant.menu.main]]
      name = "搜尋"
      url = "/search"
      weight = 60

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "github"

  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"] # is necessary