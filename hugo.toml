baseURL = "https://cloudarchitectec.com/"
languageCode = "zh-Hant"
defaultContentLanguage = "zh-Hant"
hasCJKLanguage = true # count CJK chars as words: fixes auto .Summary length, .WordCount, reading time
title = "Cloud Architect EC"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

# Pagination settings (Hugo v0.128.0+ format)
[pagination]
  pagerSize = 8  # Number of posts per page
  path = "page"   # URL structure: /page/2/

# URL configuration for Chinese characters
removePathAccents = false
disablePathToLower = true

[taxonomies]
  category = "categories"
  tag = "tags"
  episodeseries = "episodeseries"

[minify]
  disableXML = true
  minifyOutput = true

# content/drafts/ holds writing-pipeline artefacts (outlines, data tables,  notes).
# Never render them as pages, regardless of per-file front matter.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "never"
  [cascade.target]
    path = "{/drafts,/drafts/**}"

[params]
  env = "development" # CI sets HUGO_ENV=production for deploy builds; enables GA4 + production meta there
  title = "Cloud Architect EC"
  description = "澳洲雲端架構師 EC 的技術部落格 - Cloud Architect EC's Tech Blog"
  keywords = ["Cloud Architecture", "AWS", "Azure", "Tech Blog", "雲端架構"]
  author = "Cloud Architect EC"
  og_locale = "zh_TW" # Facebook-valid ll_CC locale for og:locale (languageCode zh-Hant is not a valid FB locale)
  authorDescription = "澳洲雲端架構師，前Amazon與微軟工程師，專注於雲端架構與職涯轉換"
  authorImage = "/ec-logo.png"
  consultationBookingUrl = "https://cal.com/cloudarchitectec/career-consultation"

  # Homepage redesign copy (layouts/index.html) — edit here, not in templates
  homeAboutName = "澳洲雲端架構師 EC"
  homeAboutBlurb = "曾任 Amazon 與微軟雲端架構師，現為資深 DevOps 工程師。分享轉職工程師、澳洲職場與 FIRE 理財規劃的系統性攻略。"
  homeAboutLink = "/portfolio/career-zh/"
  homePostListUrl = "/posts/2018-01-02-ec-post-list"
  homePostCount = 6

  # Google Analytics Configuration
  googleAnalytics = "G-F5Z4F1PYEE"

  # Enable Waline comments
  comments = true
  
  # SEO and Analytics enhancements
  [params.analytics]
    googleSiteVerification = "FlPzC5GcakpWZTQrkkoi896cyAcijcZ40EPSJ45Gvi8"  # Google Search Console verification
  
  # Schema.org configuration for enhanced SEO
  [params.schema]
    publisherType = "Person"  # Since you're a personal brand
    sameAs = [
      "https://www.linkedin.com/in/elliettchen/",
      "https://cloudarchitectec.com/",
      "https://www.threads.com/@cloud_architect_ec"
    ]
    
  defaultTheme = "auto" # dark, light
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  ShowPageNums = true  # Enable page numbers in pagination
  
  # Enhanced social sharing configuration
  ShareButtons = ["linkedin", "twitter", "facebook", "whatsapp"]
  
  # Social sharing customization
  [params.sharing]
    brandName = "澳洲雲端架構師 EC"
    threadsPrefix = "<澳洲雲端架構師 EC>"

  # Fuzzy search configuration optimized for Traditional Chinese
  [params.fuseOpts]
    isCaseSensitive = false
    includeScore = false
    includeMatches = false
    minMatchCharLength = 1  # Chinese characters are meaningful individually
    shouldSort = true
    findAllMatches = true   # Find all matches for better Chinese search
    keys = ["title", "permalink", "summary", "content"]
    location = 0
    threshold = 0.2  # More strict for Chinese to avoid too many false matches
    distance = 50    # Reduce distance for more precise matching
    ignoreLocation = true

  [params.assets]
    # Using existing logo as favicon
    favicon = "ec-logo.png"
    # favicon16x16 = "favicon-16x16.png"  # Uncomment when you have PNG files
    # favicon32x32 = "favicon-32x32.png"  # Uncomment when you have PNG files  
    apple_touch_icon = "ec-logo.png"
    # safari_pinned_tab = "safari-pinned-tab.svg"  # Uncomment when you have SVG files

  [params.label]
    text = "Cloud Architect EC"
    # Cloud line-art brand mark. Config-only — PaperMod's header.html already
    # supports a raw iconSVG in place of a raster icon.
    iconSVG = '<svg width="30" height="20" viewBox="0 0 46 30" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><path d="M12 25 C6 25 3 20 5 15 C6.5 11 11 10.5 14 12 C15 6.5 20.5 3.5 26 5.5 C30 7 31.5 11 30.5 14.5 C35.5 13.5 40 16.5 40 20.5 C40 23 37.5 25 34 25 Z"/></svg>'

  # profile-mode
  [params.profileMode]
    enabled = false

  # Social Icons Configuration

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:cloudarchitectec@gmail.com"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/elliettchen/"

  [[params.socialIcons]]
    name = "threads"
    url = "https://www.threads.com/@cloud_architect_ec"

  # MailerLite newsletter (HTML embed — IDs are public, not secrets)
  [params.newsletter]
    enabled = true
    accountId = "2459287"
    formId = "190870271382520893"
    embedId = "42852034"

