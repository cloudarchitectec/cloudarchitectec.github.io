<!-- Anonymous Comment System Example -->
<div id="comments-section" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
  <h3>留言 (無需登入)</h3>
  
  <!-- Comment Form -->
  <form name="comments" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/thank-you/">
    <!-- Honeypot for spam protection -->
    <input type="hidden" name="bot-field" />
    
    <!-- Hidden field for page URL -->
    <input type="hidden" name="page-url" value="{{ .Permalink }}" />
    <input type="hidden" name="page-title" value="{{ .Title }}" />
    
    <div style="margin-bottom: 1rem;">
      <label for="name">姓名 (可選):</label>
      <input type="text" name="name" id="name" placeholder="匿名" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
    </div>
    
    <div style="margin-bottom: 1rem;">
      <label for="email">Email (不會公開):</label>
      <input type="email" name="email" id="email" placeholder="your@email.com" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
    </div>
    
    <div style="margin-bottom: 1rem;">
      <label for="comment">留言內容:</label>
      <textarea name="comment" id="comment" rows="4" required placeholder="請輸入您的留言..." style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; resize: vertical;"></textarea>
    </div>
    
    <button type="submit" style="background: var(--theme); color: var(--primary); border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer;">
      送出留言
    </button>
  </form>
  
  <!-- Display Comments (you'd load these from a JSON file or API) -->
  <div id="comments-display" style="margin-top: 2rem;">
    <p><em>留言將在審核後顯示</em></p>
    <!-- Comments would be loaded here via JavaScript or during Hugo build -->
  </div>
</div>
