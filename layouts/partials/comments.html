{{- if (ne (.Param "comments") false) }}
<div id="remark42"></div>
<script>
  var remark_config = {
    host: "https://comments.cloudarchitectec.com",
    site_id: "cloudarchitectec",
    locale: "zh-TW",
    components: ["embed"],
    no_footer: true,
  };
  (function(c) {
    for (var i = 0; i < c.length; i++) {
      var d = document, s = d.createElement("script");
      s.src = remark_config.host + "/web/" + c[i] + ".js";
      s.defer = true;
      d.head.appendChild(s);
    }
  })(remark_config.components || ["embed"]);
</script>
{{- end }}
