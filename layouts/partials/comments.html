{{- if (ne (.Param "comments") false) }}
<div class="comments-section">
  <p class="comments-hint">快來分享你的想法吧～</p>
  <div id="waline"></div>
</div>
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
<script type="module">
  import { init } from "https://unpkg.com/@waline/client@v3/dist/waline.js";

  init({
    el: "#waline",
    serverURL: "https://comments.cloudarchitectec.com",
    lang: "zh-TW",
    locale: {
      placeholder: "寫下你的想法吧！",
      sofa: "還沒有留言，快來搶沙發！",
      submit: "送出",
      nick: "暱稱",
      mail: "Email",
      optional: "選填",
      latest: "最新留言",
      oldest: "最舊留言",
      hottest: "熱門留言",
      comment: "則留言",
    },
    meta: ["nick", "mail"],
    requiredMeta: ["nick"],
    login: "disable",
    search: false,
    copyright: false,
    pageview: false,
  });
</script>
{{- end }}
