{{- with .cxt }}
{{- if (and .Params.cover.image (not $.isHidden)) }}
<figure class="entry-cover">
    {{- $loading := cond $.IsSingle "eager" "lazy" }}
    {{- $addLink := (and site.Params.cover.linkFullImages $.IsSingle) }}
    {{- $prod := (hugo.IsProduction | or (eq site.Params.env "production")) }}
    {{- $alt := (.Params.cover.alt | default .Params.cover.caption | plainify) }}
    {{- $responsiveImages := (.Params.cover.responsiveImages | default site.Params.cover.responsiveImages) | default true }}

    {{- $imgPath := .Params.cover.image | strings.TrimPrefix "/" }}
    {{- $pageBundleCover := .Resources.Get $imgPath }}
    {{- if not $pageBundleCover }}
        {{- $pageBundleCover = (.Resources.ByType "image").GetMatch (printf "*%s*" (path.Base $imgPath)) }}
    {{- end }}
    {{- $globalResourcesCover := (resources.ByType "image").GetMatch (printf "*%s*" (path.Base $imgPath)) }}
    {{- $cover := (or $pageBundleCover $globalResourcesCover) }}

    {{- $sizes := (slice "360" "480" "720" "1080" "1500") }}
    {{- $processableFormats := (slice "jpg" "jpeg" "png" "tif" "bmp" "gif") -}}
    {{- if hugo.IsExtended -}}
        {{- $processableFormats = $processableFormats | append "webp" -}}
    {{- end -}}

    {{- $imgdl := (.Params.cover.image) | absURL }}
    {{- if $cover -}}
        {{- $imgdl = $cover.Permalink }}
    {{- end -}}

    {{- if $addLink }}
        <a href="{{ $imgdl }}" target="_blank" rel="noopener noreferrer">
    {{- end }}

    {{- if $cover -}}
        {{- if (and (in $processableFormats $cover.MediaType.SubType) ($responsiveImages) (eq $prod true)) }}
            {{- /* WebP <source> + original-format <img> fallback; og:image/RSS keep the
                   untouched original via templates/opengraph.html / rss.xml. Full-width
                   WebP only when it beats the original (small covers can re-encode larger);
                   no worthwhile WebP variant -> plain <img>, no <picture>. */}}
            {{- $webpVariants := slice }}
            {{- /* Width 0 = Hugo couldn't decode the file (e.g. misnamed format) — skip
                   WebP entirely rather than crash the build on Resize */}}
            {{- if gt $cover.Width 0 }}
            {{- range $size := $sizes }}
                {{- if gt $cover.Width (int $size) }}
                    {{- $webpVariants = $webpVariants | append (printf "%s %sw" (($cover.Resize (printf "%sx webp q85" $size)).Permalink) $size) }}
                {{- end }}
            {{- end }}
            {{- $fullWebp := $cover.Resize (printf "%dx webp q85" $cover.Width) }}
            {{- if lt (len $fullWebp.Content) (len $cover.Content) }}
                {{- $webpVariants = $webpVariants | append (printf "%s %dw" $fullWebp.Permalink $cover.Width) }}
            {{- end }}
            {{- end }}
            {{- if $webpVariants }}
            <picture>
                <source type="image/webp"
                    srcset='{{ delimit $webpVariants ", " }}'
                    sizes="(min-width: 768px) 720px, 100vw">
            {{- end }}
                <img loading="{{ $loading }}"
                    srcset='{{- range $size := $sizes -}}
                                {{- if (ge $cover.Width $size) }}
                                    {{- printf "%s %s" (($cover.Resize (printf "%sx" $size)).Permalink) (printf "%sw," $size) }}
                                {{- end }}
                            {{- end }}
                            {{- printf "%s %dw" ($cover.Permalink) ($cover.Width) }}'
                    src="{{ $cover.Permalink }}"
                    sizes="(min-width: 768px) 720px, 100vw"
                    width="{{ $cover.Width }}" height="{{ $cover.Height }}"
                    alt="{{ $alt }}">
            {{- if $webpVariants }}
            </picture>
            {{- end }}
        {{- else }}
            <img loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}"
                {{- with $cover }} width="{{ .Width }}" height="{{ .Height }}"{{ end }}>
        {{- end }}
    {{- else }}
        <img loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}">
    {{- end }}

    {{- if $addLink }}
        </a>
    {{- end }}

    {{- if $.IsSingle }}
        {{- with .Params.cover.caption }}
            <figcaption>{{ . | markdownify }}</figcaption>
        {{- end }}
        {{- with .Params.cover.credit }}
            <figcaption class="cover-credit">
                Photo by <a href="{{ .photographer_url }}?utm_source=cloudarchitectec&amp;utm_medium=referral&amp;utm_content=creditCopyText" rel="noopener noreferrer">{{ .photographer }}</a> on <a href="{{ .photo_url }}?utm_source=cloudarchitectec&amp;utm_medium=referral&amp;utm_content=creditCopyText" rel="noopener noreferrer">Unsplash</a>
            </figcaption>
        {{- end }}
    {{- end }}
</figure>
{{- end }}
{{- end }}
