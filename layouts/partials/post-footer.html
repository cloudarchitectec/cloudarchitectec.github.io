{{/* Post footer CTAs: subscribe + coffee. Included from layouts/_default/single.html (after tags). */}}
<section class="post-footer-cta">
  <div class="post-footer-cta-card">
    {{- if .Site.Params.newsletter.enabled }}
    <div id="mlb2-{{ .Site.Params.newsletter.embedId }}"
         class="ml-form-embedContainer ml-subscribe-form ml-subscribe-form-{{ .Site.Params.newsletter.embedId }}">
      <div class="ml-form-embedWrapper embedForm">
        <div class="ml-form-embedBody ml-form-embedBodyDefault row-form">
          <div class="ml-form-embedContent post-footer-cta-heading">
            <h4>訂閱 EC 部落格</h4>
            <p>隨時收到最新文章通知～</p>
          </div>
          <form class="ml-block-form post-footer-cta-form"
                action="https://dashboard.mailerlite.com/jsonp/{{ .Site.Params.newsletter.accountId }}/forms/{{ .Site.Params.newsletter.formId }}/subscribe"
                method="post" target="_blank">
            <div class="ml-form-formContent">
              <div class="ml-form-fieldRow ml-last-item">
                <div class="ml-field-group ml-field-email ml-validate-email ml-validate-required">
                  <input aria-label="email" aria-required="true" type="email" class="form-control"
                         name="fields[email]" placeholder="請輸入 Email..." autocomplete="email" required>
                </div>
              </div>
            </div>
            <input type="hidden" name="ml-submit" value="1">
            <div class="ml-form-embedSubmit">
              <button type="submit" class="primary">免費訂閱</button>
              <button disabled style="display: none;" type="button" class="loading">
                <div class="ml-form-embedSubmitLoad"></div>
                <span class="sr-only">Loading...</span>
              </button>
            </div>
            <input type="hidden" name="anticsrf" value="true">
          </form>
        </div>
        <div class="ml-form-successBody row-success" style="display: none">
          <div class="ml-form-successContent post-footer-cta-success">
            <h4>訂閱成功！</h4>
            <p>感謝訂閱，期待在你的信箱見面 😊</p>
          </div>
        </div>
      </div>
    </div>

    <script>
    (function (id) {
      window['ml_webform_success_' + id] = function () {
        var $ = ml_jQuery || jQuery;
        $('.ml-subscribe-form-' + id + ' .row-success').show();
        $('.ml-subscribe-form-' + id + ' .row-form').hide();
      };
    })('{{ .Site.Params.newsletter.embedId }}');
    </script>
    <script src="https://groot.mailerlite.com/js/w/webforms.min.js?v83147fa8ce2d95cb73ece7f28b469519" defer></script>
    {{- end }}
    <div class="post-footer-cta-coffee{{ if .Site.Params.newsletter.enabled }} post-footer-cta-coffee--divider{{ end }}">
      <a class="post-footer-cta-coffee-btn" href="https://donate.stripe.com/8wM8xU44n5Ld9Q4bIJ" target="_blank" rel="noopener noreferrer">
        如果這篇文章對你有幫助，請 EC 喝杯咖啡吧 ☕
      </a>
    </div>
  </div>
</section>
