{{/* Shared JS + CSS for the Medium-style share button. Include ONCE per page.
     The script binds to every .share-toggle-button on the page, so a single
     include covers both the single-post button and all post-list buttons.
     Markup lives in partials/share_buttons.html. */}}
<script>
document.addEventListener('DOMContentLoaded', function() {
  let isTransitioning = false;
  let currentDropdown = null;
  let lastClickTime = 0;

  // Handle toggle button clicks
  document.querySelectorAll('.share-toggle-button').forEach(button => {
    button.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();

      // Debounce clicks
      const now = Date.now();
      if (now - lastClickTime < 300 || isTransitioning) {
        return;
      }
      lastClickTime = now;

      const dropdown = this.nextElementSibling;
      const isExpanded = this.getAttribute('aria-expanded') === 'true';

      isTransitioning = true;

      if (isExpanded) {
        // Hide dropdown
        this.setAttribute('aria-expanded', 'false');
        dropdown.setAttribute('aria-hidden', 'true');
        dropdown.classList.remove('show');
        currentDropdown = null;

        setTimeout(() => {
          if (!dropdown.classList.contains('show')) {
            dropdown.style.display = 'none';
          }
          isTransitioning = false;
        }, 300);
      } else {
        // Close any other open dropdown first
        if (currentDropdown && currentDropdown !== dropdown) {
          const prevButton = currentDropdown.previousElementSibling;
          prevButton.setAttribute('aria-expanded', 'false');
          currentDropdown.setAttribute('aria-hidden', 'true');
          currentDropdown.classList.remove('show');
          currentDropdown.style.display = 'none';
        }

        // Show dropdown
        this.setAttribute('aria-expanded', 'true');
        dropdown.setAttribute('aria-hidden', 'false');
        dropdown.style.display = 'flex';
        currentDropdown = dropdown;

        // Force a reflow
        dropdown.offsetHeight;

        requestAnimationFrame(() => {
          dropdown.classList.add('show');
          setTimeout(() => {
            isTransitioning = false;
          }, 300);
        });
      }
    });
  });

  // Prevent dropdown from closing when clicking inside
  document.querySelectorAll('.share-dropdown').forEach(dropdown => {
    dropdown.addEventListener('click', e => {
      e.stopPropagation();
    });
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    const openDropdown = document.querySelector('.share-dropdown.show');
    if (openDropdown && !e.target.closest('.medium-share_buttons')) {
      const button = openDropdown.previousElementSibling;
      button.setAttribute('aria-expanded', 'false');
      openDropdown.setAttribute('aria-hidden', 'true');
      openDropdown.classList.remove('show');
      currentDropdown = null;
      isTransitioning = true;

      setTimeout(() => {
        if (!openDropdown.classList.contains('show')) {
          openDropdown.style.display = 'none';
        }
        isTransitioning = false;
      }, 300);
    }
  });
});

function copyPageUrl(button) {
  const url = button.getAttribute('data-url');
  navigator.clipboard.writeText(url).then(() => {
    const tooltip = button.closest('.medium-share_buttons').querySelector('.copy-tooltip');
    tooltip.setAttribute('aria-hidden', 'false');
    tooltip.style.display = 'block';
    setTimeout(() => tooltip.classList.add('show'), 10);

    setTimeout(() => {
      tooltip.classList.remove('show');
      setTimeout(() => {
        tooltip.style.display = 'none';
        tooltip.setAttribute('aria-hidden', 'true');
      }, 300);
    }, 2000);
  });
}

function shareFacebook(button) {
  const url = button.getAttribute('data-url');
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
}

function shareThreads(button) {
  const url = button.getAttribute('data-url');
  const title = button.getAttribute('data-title');
  const prefix = button.getAttribute('data-prefix');
  window.open(`https://threads.net/intent/post?text=${encodeURIComponent(prefix)}%0A${encodeURIComponent(title)}%20${encodeURIComponent(url)}`);
}

function shareEmail(button) {
  const url = button.getAttribute('data-url');
  const title = button.getAttribute('data-title');
  window.open(`mailto:?subject=${title}&body=${title}%0A${url}`);
}
</script>

<style>

  position: relative;
  display: flex;
  justify-content: flex-end;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}

.share-toggle-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 8px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #757575;
  cursor: pointer;
  transition: all 0.2s ease;
}

.share-toggle-button:hover {
  background-color: rgba(0, 0, 0, 0.05);
  color: #333;
}

.share-dropdown {
  display: none;
  position: absolute;
  bottom: 100%;
  right: 0;
  margin-bottom: 8px;
  padding: 8px;
  border-radius: 4px;
  background-color: white;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  flex-direction: column;
  min-width: 200px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 1000;
  pointer-events: none;
}

.share-dropdown.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.share-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border: none;
  background: none;
  color: #333;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  width: 100%;
  transition: background-color 0.2s ease;
}

.share-option:hover {
  background-color: rgba(0, 0, 0, 0.05);
}

.share-option svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.copy-tooltip {
  display: none;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  margin-top: 8px;
  padding: 6px 12px;
  border-radius: 4px;
  background-color: #333;
  color: white;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.copy-tooltip.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.copy-tooltip::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  margin-left: -4px;
  border-width: 0 4px 4px;
  border-style: solid;
  border-color: transparent transparent #333;
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
  .share-toggle-button {
    color: #a0a0a0;
  }

  .share-toggle-button:hover {
    background-color: rgba(255, 255, 255, 0.1);
    color: #e0e0e0;
  }

  .share-dropdown {
    background-color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .share-option {
    color: #e0e0e0;
  }

  .share-option:hover {
    background-color: rgba(255, 255, 255, 0.1);
  }
}
</style>
