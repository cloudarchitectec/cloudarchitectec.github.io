{{/* 
Analytics Stats Shortcode
Usage: {{< analytics-stats >}}
Shows site stats in a compact, WordPress-style widget with country flags.
Rendering lives in partials/blog_stats.html (shared with layouts/index.html).
*/}}

{{- partial "blog_stats.html" . -}}

<style>
.blog-stats-widget {
  font-size: 0.85rem;
  color: var(--secondary);
  margin: 1rem 0 2rem 0;
  padding: 0.75rem 1rem;
  background: var(--code-bg);
  border-left: 3px solid var(--theme);
  border-radius: 4px;
  font-family: inherit;
}

.stats-summary {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.stats-line-1 {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}

.stats-line-2 {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.stat-item {
  color: var(--content);
  font-size: 0.85rem;
}

.stat-item strong {
  color: var(--primary);
  font-weight: 600;
}

.stat-separator {
  color: var(--tertiary);
  font-weight: normal;
}

.countries-flags {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.flag-stat {
  font-size: 0.8rem;
  color: var(--content);
  white-space: nowrap;
  cursor: help;
}

.flag-stat:hover {
  color: var(--primary);
}

/* Light mode optimization */
:root {
  --stats-bg-light: #f8f9fa;
  --stats-border-light: #e9ecef;
}

@media (prefers-color-scheme: light) {
  .blog-stats-widget {
    background: var(--stats-bg-light, #f8f9fa);
    border-left-color: var(--stats-border-light, #e9ecef);
  }
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .blog-stats-widget {
    background: var(--code-bg);
    border-left-color: var(--border);
  }
}

/* Mobile responsive */
@media (max-width: 480px) {
  .stats-summary {
    justify-content: center;
    text-align: center;
  }
  
  .blog-stats-widget {
    font-size: 0.8rem;
    padding: 0.6rem 0.8rem;
  }
  
  .countries-flags {
    gap: 0.3rem;
  }
  
  .flag-stat {
    font-size: 0.75rem;
  }
}
</style>
