{{- $written := .Get "written" -}}
{{- $reviewed := .Get "reviewed" -}}
{{- $title := .Get "title" | default (cond (ne $written "") (printf "本文寫於 %s，資訊已過時" $written) "本文資訊已過時") -}}
<aside class="post-outdated" role="note" aria-label="過時資訊提醒">
  <p class="post-outdated__title">
    <span class="post-outdated__icon" aria-hidden="true">⚠️</span>{{ $title }}
    {{- with $reviewed }}<span class="post-outdated__meta">最後更新 {{ . }}</span>{{ end -}}
  </p>
  <div class="post-outdated__body">
    {{ .Inner | markdownify }}
  </div>
</aside>
